<!DOCTYPE html>

<html>

<head>

<title>StudyBuddy AI</title>

<style>
body{
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background: linear-gradient(135deg,#eef2ff,#f8fafc);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:white;
padding:25px;
width:420px;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,0.06);
border:1px solid #eee;
}

h2{
text-align:center;
margin-bottom:18px;
color:#111827;
font-weight:600;
}
.subtitle{
text-align:center;
font-size:13px;
color:#4b5563;
margin-bottom:12px;
}

#chatbox{
height:330px;
overflow-y:auto;
padding:12px;
background:#f8fafc;
border-radius:12px;
margin-bottom:12px;
border:1px solid #e5e7eb;
}

.user{
background:#4f46e5;
color:white;
padding:10px 14px;
border-radius:10px;
margin:8px 0;
margin-left:auto;
width:fit-content;
font-size:14px;
max-width:85%;
}


.bot{
background:white;
padding:10px 14px;
border-radius:10px;
margin:8px 0;
border:1px solid #e5e7eb;
width:fit-content;
font-size:14px;
white-space: pre-wrap;
line-height:1.5;
max-width:85%;
}

.input-area{
display:flex;
gap:8px;
}

input{
flex:1;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
font-size:14px;
}

button{
padding:10px 18px;
border:none;
background:#4f46e5;
color:white;
border-radius:10px;
cursor:pointer;
font-weight:500;
}

button:hover{
background:#4338ca;
}

</style>

</head>

<body>
<div class="card">
<h2>StudyBuddy AI</h2>
<div class="subtitle">Academic AI Assistant</div>
<div id="chatbox"></div>

<div class="input-area">
<input id="question" placeholder="Ask any study question...">
<button onclick="send()">Send</button>
</div>

</div>


<script>

async function send(){

const input = document.getElementById("question")
const message = input.value

const box = document.getElementById("chatbox")

box.innerHTML += `<div class="user">${message}</div>`

const res = await fetch("http://localhost:5000/chat", {

method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({message})

})

const data = await res.json()

box.innerHTML += `<div class="bot">${data.reply}</div>`

input.value = ""

}
document.getElementById("question").addEventListener("keypress", function(e){
if(e.key === "Enter"){
send()
}
})

</script>

</body>

</html>
